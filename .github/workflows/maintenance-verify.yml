name: Maintenance Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository regressions
        run: node --test tests/*.test.mjs
      - name: Typecheck
        run: npx --yes --package typescript@5.9.2 tsc --noEmit
      - name: Production build
        run: npm run build
